[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rethlas-core"
version = "0.1.0"
description = "Rethlas trusted protocol and mathematical memory contracts"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["jsonschema==4.26.0"]

[project.urls]
Repository = "https://github.com/I0amLK/K-Rethlas"
Upstream = "https://github.com/frenzymath/Rethlas"

[project.optional-dependencies]
server = ["fastapi==0.128.0", "uvicorn==0.40.0", "httpx==0.28.1"]
mcp = ["mcp==1.30.0", "requests==2.32.5"]
sources = ["pypdf==6.19.0"]

[project.scripts]
rethlas-control = "rethlas_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rethlas_core = ["schemas/*.json"]
